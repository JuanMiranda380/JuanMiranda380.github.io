<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Pokédex Simples</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #333;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            color: #e3350d;
            margin-bottom: 15px;
        }

        #search-input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #ccc;
            border-radius: 25px;
            outline: none;
            transition: 0.3s;
        }

        #search-input:focus {
            border-color: #e3350d;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .pokemon-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .pokemon-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .pokemon-card img {
            width: 120px;
            height: 120px;
        }

        .pokemon-id {
            font-size: 0.85rem;
            color: #888;
        }

        .pokemon-name {
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: capitalize;
            margin-top: 5px;
            color: #222;
        }

        .pokemon-types {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 10px;
        }

        .type {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            color: #fff;
            text-transform: capitalize;
        }

        /* Cores básicas para os tipos */
        .type-grass { background-color: #78c850; }
        .type-fire { background-color: #f08030; }
        .type-water { background-color: #6890f0; }
        .type-bug { background-color: #a8b820; }
        .type-normal { background-color: #a8a878; }
        .type-poison { background-color: #a040a0; }
        .type-electric { background-color: #f8d030; color: #333; }
        .type-ground { background-color: #e0c068; }
        .type-fairy { background-color: #ee99ac; }
        .type-fighting { background-color: #c03028; }
        .type-psychic { background-color: #f85888; }
        .type-rock { background-color: #b8a038; }
        .type-ghost { background-color: #705898; }
        .type-ice { background-color: #98d8d8; }
        .type-dragon { background-color: #7038f8; }
    </style>
</head>
<body>

    <header>
        <h1>Pokédex</h1>
        <input type="text" id="search-input" placeholder="Pesquisar Pokémon...">
    </header>

    <main>
        <div id="pokedex-container" class="grid-container">
            <!-- Os cards dos Pokémon aparecem aqui via JavaScript -->
        </div>
    </main>

    <script>
        const container = document.getElementById('pokedex-container');
        const searchInput = document.getElementById('search-input');
        let allPokemons = [];

        // Busca os primeiros 150 Pokémon da API
        async function fetchPokemons() {
            try {
                const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=150');
                const data = await response.json();
                
                // Busca os detalhes de cada um em paralelo
                const pokemonPromises = data.results.map(async (pokemon) => {
                    const res = await fetch(pokemon.url);
                    return await res.json();
                });

                allPokemons = await Promise.all(pokemonPromises);
                displayPokemons(allPokemons);
            } catch (error) {
                console.error("Erro ao carregar os Pokémon:", error);
            }
        }

        // Renderiza os cards na tela
        function displayPokemons(pokemons) {
            container.innerHTML = '';
            
            pokemons.forEach(pokemon => {
                const card = document.createElement('div');
                card.classList.add('pokemon-card');

                const pokeId = String(pokemon.id).padStart(3, '0');
                const pokeImage = pokemon.sprites.other['official-artwork'].front_default || pokemon.sprites.front_default;
                
                // Cria as tags de tipos
                const typesHtml = pokemon.types.map(t => `<span class="type type-${t.type.name}">${t.type.name}</span>`).join('');

                card.innerHTML = `
                    <span class="pokemon-id">#${pokeId}</span>
                    <img src="${pokeImage}" alt="${pokemon.name}">
                    <h3 class="pokemon-name">${pokemon.name}</h3>
                    <div class="pokemon-types">
                        ${typesHtml}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Funcionalidade de pesquisa
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allPokemons.filter(pokemon => 
                pokemon.name.toLowerCase().includes(term) || 
                String(pokemon.id).includes(term)
            );
            displayPokemons(filtered);
        });

        // Inicializa a aplicação
        fetchPokemons();
    </script>
</body>
</html>
